name: Monitor deployed applications

on:
  schedule:
    # Daily at 13:17 UTC (09:17 Toronto during daylight time).
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    name: Check ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CVMatch Pro
            url: https://cvmatch-pro.vercel.app/login
          - name: Dax Flow
            url: https://dax-flow.onrender.com/
          - name: Dataflow Studio
            # Streamlit's health endpoint avoids the app shell's redirect loop.
            url: https://dataflow-studio.streamlit.app/_stcore/health
    steps:
      - name: Check public URL
        env:
          APP_NAME: ${{ matrix.name }}
          APP_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          echo "Checking ${APP_NAME}: ${APP_URL}"
          curl --location --fail --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            --write-out "HTTP %{http_code}\n" \
            "${APP_URL}"

  notify:
    name: Notify monitoring failure
    if: ${{ failure() }}
    needs: availability
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update GitHub alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Monitoring] Une application est indisponible";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Le contrôle quotidien a détecté une erreur sur au moins une application.",
              "",
              `Consultez les détails du contrôle : ${runUrl}`,
              "",
              "Applications surveillées : CVMatch Pro, Dax Flow et Dataflow Studio.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
