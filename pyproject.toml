[project]
name = "atelier-etl"
version = "0.2.0"
description = "Atelier local de préparation et de contrôle des données"
requires-python = ">=3.12,<3.15"
dependencies = [
  "streamlit>=1.57,<2",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "pyarrow>=19,<24",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5", "xlwt>=1.3,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

